# RMS — base stack (used in every mode: dev, local store server, hosted server).
# Mode-specific parts live in docker-compose.dev.yml and docker-compose.prod.yml.
# Which files are active is set by COMPOSE_FILE in .env (created by scripts/setup.sh),
# so the same command works everywhere:  docker compose up -d
#
# VERIFY before first use: ODOO_IMAGE and POSTGRES_IMAGE tags (set in .env).

name: ${COMPOSE_PROJECT_NAME:-rms}

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup.sh to create .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh to create .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published: the database is reachable only from other containers.

  odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo              # filestore, sessions (back this up with the DB)
      - ./config:/etc/odoo:ro                # odoo.conf (generated by scripts/setup.sh)
      - ./custom_addons:/mnt/extra-addons    # custom modules, e.g. retail_management

volumes:
  db-data:
  odoo-data:
